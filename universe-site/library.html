<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Библиотека — Лаборатория писателя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <button class="menu-toggle" id="menu-toggle" type="button" title="Меню">☰</button>
    <h1>🧪 Лаборатория писателя</h1>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="profile.html">👤 Профиль</a>
      <a href="editor.html">📝 Редактор</a>
      <a href="search.html">🔎 Поиск</a>
      <a href="library.html" class="active">📚 Библиотека</a>
    </nav>
    <a href="login.html" id="auth-link" class="header-auth">Вход</a>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h3>Разделы</h3>
      <nav>
        <a href="favorites.html">Избранное</a>
        <a href="messages.html">Сообщения</a>
        <a href="universe.html">Вселенная</a>
        <a href="characters.html">Персонажи</a>
        <a href="planner.html">Планировщик</a>
        <a href="support.html">Поддержка</a>
      </nav>
      <h3>Настройки</h3>
      <button id="theme-toggle" class="theme-btn" type="button">🌙 Тема</button>
    </aside>

    <main>
      <section>
        <h2>📚 Опубликованные истории</h2>
        <div class="library-filters">
          <input id="lib-search" type="search" placeholder="Поиск по названию, автору, тексту...">
          <div class="filters-row">
            <select id="lib-genre">
              <option value="">Все жанры</option>
              <option>Фэнтези</option><option>Фантастика</option><option>Романтика</option>
              <option>Детектив</option><option>Хоррор</option><option>Драма</option>
              <option>Приключения</option><option>Поэзия</option><option>Другое</option>
            </select>
            <select id="lib-sort">
              <option value="new">Сначала новые</option>
              <option value="old">Сначала старые</option>
              <option value="az">По названию (А→Я)</option>
              <option value="likes">По лайкам</option>
              <option value="recs">По советам</option>
            </select>
          </div>
          <label class="checkbox">
            <input id="lib-fav-only" type="checkbox"> Только избранное
          </label>
        </div>
        <p id="lib-count" class="muted"></p>
        <article id="library-list" class="card-list"></article>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>© 2026 Лаборатория писателя</p>
    <p><a href="support.html">🛠️ Техподдержка</a> · <a href="messages.html"> Сообщения</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
