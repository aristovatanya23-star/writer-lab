<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Персонажи — Лаборатория писателя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <button class="menu-toggle" id="menu-toggle" type="button" title="Меню">☰</button>
    <h1>🧪 Лаборатория писателя</h1>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="profile.html">👤 Профиль</a>
      <a href="editor.html">📝 Редактор</a>
      <a href="search.html">🔎 Поиск</a>
      <a href="library.html">📚 Библиотека</a>
    </nav>
    <a href="login.html" id="auth-link" class="header-auth">Вход</a>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h3>Разделы</h3>
      <nav>
        <a href="favorites.html">❤️ Избранное</a>
        <a href="messages.html">💬 Сообщения</a>
        <a href="universe.html">🌍 Вселенная</a>
        <a href="characters.html" class="active">🧑‍🎤 Персонажи</a>
        <a href="planner.html">🗂️ Планировщик</a>
        <a href="support.html">🛠️ Поддержка</a>
      </nav>
      <h3>Настройки</h3>
      <button id="theme-toggle" class="theme-btn" type="button">🌙 Тема</button>
    </aside>

    <main>
      <section>
        <h2>Новая карточка</h2>
        <form id="character-form">
          <label for="char-name">Имя</label>
          <input id="char-name" type="text" placeholder="Имя персонажа" required>
          <label for="char-role">Роль</label>
          <input id="char-role" type="text" placeholder="Герой / Антагонист / Союзник" required>
          <label for="char-desc">Описание</label>
          <textarea id="char-desc" rows="5" placeholder="Характер, мотивация..." required></textarea>
          <label for="char-img">Портрет (URL картинки)</label>
          <input id="char-img" type="url" placeholder="https://example.com/hero.jpg">
          <button class="btn" type="submit">Добавить персонажа</button>
        </form>
      </section>

      <section>
        <h2>Все персонажи</h2>
        <article id="characters-list" class="card-list"></article>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>© 2026 Лаборатория писателя</p>
    <p><a href="support.html">🛠️ Техподдержка</a> · <a href="messages.html">💬 Сообщения</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
