<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор — Лаборатория писателя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <button class="menu-toggle" id="menu-toggle" type="button" title="Меню">☰</button>
    <h1>🧪 Лаборатория писателя</h1>
    <nav class="main-nav">
      <a href="index.html">Главная</a>
      <a href="profile.html">👤 Профиль</a>
      <a href="editor.html" class="active">📝 Редактор</a>
      <a href="search.html">🔎 Поиск</a>
      <a href="library.html">📚 Библиотека</a>
    </nav>
    <a href="login.html" id="auth-link" class="header-auth">Вход</a>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <h3>Разделы</h3>
      <nav>
        <a href="favorites.html">❤️ Избранное</a>
        <a href="messages.html">💬 Сообщения</a>
        <a href="universe.html">🌍 Вселенная</a>
        <a href="characters.html">🧑‍🎤 Персонажи</a>
        <a href="planner.html">🗂️ Планировщик</a>
        <a href="support.html">🛠️ Поддержка</a>
      </nav>
      <h3>Настройки</h3>
      <button id="theme-toggle" class="theme-btn" type="button">🌙 Тема</button>
    </aside>

    <main>
      <section>
        <h2>Новая история</h2>
        <form id="editor-form">
          <label for="title">Название</label>
          <input id="title" type="text" placeholder="Глава 1. Начало" required>

          <label for="summary">Саммари (краткое описание)</label>
          <textarea id="summary" rows="3" placeholder="О чём история?"></textarea>

          <label for="cover">Обложка (URL картинки)</label>
          <input id="cover" type="url" placeholder="https://example.com/cover.jpg">

          <label for="genre">Жанр</label>
          <select id="genre">
            <option>Фэнтези</option><option>Фантастика</option><option>Романтика</option>
            <option>Детектив</option><option>Хоррор</option><option>Драма</option>
            <option>Приключения</option><option>Поэзия</option><option>Другое</option>
          </select>

          <label for="status">Статус</label>
          <select id="status">
            <option>В процессе</option><option>Завершено</option>
            <option>Безжалостно брошено</option><option>Заморожено</option>
          </select>

          <label for="warnings">Предупреждения (через запятую)</label>
          <input id="warnings" type="text" placeholder="смерть персонажа, насилие">

          <label for="tags">Метки / теги (через запятую)</label>
          <input id="tags" type="text" placeholder="драконы, магия, дружба">

          <label for="fandom">Фандом (необязательно)</label>
          <input id="fandom" type="text" placeholder="Гарри Поттер, оридж">

          <label for="pairing">Пейринг (необязательно)</label>
          <input id="pairing" type="text" placeholder="Гарри/Драко">

          <label for="text">Текст</label>
          <textarea id="text" rows="14" placeholder="Пиши здесь..." required></textarea>

          <label for="authorNote">Примечание автора</label>
          <textarea id="authorNote" rows="3" placeholder="Спасибо за прочтение!"></textarea>

          <button class="btn" type="submit">Сохранить</button>
        </form>
      </section>

      <section>
        <h2>Мои тексты</h2>
        <input id="search-text" type="search" placeholder="🔍 Поиск по моим текстам...">
        <div class="toolbar">
          <button id="export-all" class="btn btn-ghost" type="button">⬇️ Экспорт всех в .txt</button>
          <button class="btn btn-ghost" type="button" onclick="dlAllMine()">📚 Скачать все мои рукописи (.txt)</button>
          <button id="clear-texts" class="btn btn-danger" type="button">🗑️ Очистить всё</button>
        </div>
        <article id="texts-list" class="card-list"></article>
      </section>
    </main>
  </div>

  <footer class="site-footer">
    <p>© 2026 Лаборатория писателя</p>
    <p><a href="support.html">🛠️ Техподдержка</a> · <a href="messages.html">💬 Сообщения</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
